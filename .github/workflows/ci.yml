name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 中文：固定受支持宿主，两OS都运行真实helper与完整门禁。
        # English: Pin supported hosts and run the real helper plus the complete gate on both operating systems.
        os:
          - ubuntu-24.04
          - windows-2022
        node:
          - 22.x
          - 24.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dependencies
        run: npm ci

      - name: Record selected tool environment
        run: |
          dotnet --version
          dotnet --list-runtimes
          node --version

      - name: Run release gate
        run: npm run release:gate
