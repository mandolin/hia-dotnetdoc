name: npm Trusted Publish

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Candidate package name, for example @hia-doc/dotnetdoc-runner"
        required: true
        type: string
      confirm_publish:
        description: "Type: publish @hia-doc dotnetdoc package"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package with npm provenance
    if: inputs.confirm_publish == 'publish @hia-doc dotnetdoc package'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install npm trusted publishing baseline
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Resolve package
        id: resolve
        run: node scripts/resolve-release-package.cjs "${{ inputs.package_name }}" --github-output

      - name: Pack package
        run: |
          mkdir -p "$RUNNER_TEMP/hia-pack"
          npm pack --workspace "${{ steps.resolve.outputs.package_name }}" --pack-destination "$RUNNER_TEMP/hia-pack"
          ls -la "$RUNNER_TEMP/hia-pack"

      - name: Publish package tarball
        run: npm publish "$RUNNER_TEMP"/hia-pack/*.tgz --access public --provenance --registry=https://registry.npmjs.org/
