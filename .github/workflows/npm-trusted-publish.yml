name: npm Trusted Publish

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select which release path to run
        type: choice
        required: true
        default: stable
        options:
          - stable
          - candidate-audit
          - candidate-publish
      package_name:
        description: "Candidate package name, for example @hia-doc/dotnetdoc-runner"
        required: false
        type: string
      confirm_publish:
        description: "Type: publish @hia-doc dotnetdoc package"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: npm-trusted-publish-${{ inputs.package_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package with npm provenance
    if: inputs.operation == 'stable' && inputs.package_name != '' && inputs.confirm_publish == 'publish @hia-doc dotnetdoc package'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      # 中文：local-candidate不能通过此门禁，源码候选验收不等于发布就绪。
      # English: local-candidate cannot pass this guard; source-candidate acceptance is not publication readiness.
      - name: Require explicit publication readiness
        run: node scripts/check-release-plan.cjs --publication-ready

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install npm trusted publishing baseline
        run: npm install -g npm@^11.15.0

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:gate

      - name: Resolve package
        id: resolve
        run: node scripts/resolve-release-package.cjs "${{ inputs.package_name }}" --github-output

      - name: Pack package
        run: |
          mkdir -p "$RUNNER_TEMP/hia-pack"
          npm pack --workspace "${{ steps.resolve.outputs.package_name }}" --pack-destination "$RUNNER_TEMP/hia-pack"
          ls -la "$RUNNER_TEMP/hia-pack"

      - name: Publish package tarball
        run: npm publish "$RUNNER_TEMP"/hia-pack/*.tgz --access public --provenance --registry=https://registry.npmjs.org/

  candidate:
    # <lang lang="zh-CN">只使用全局已核对的归档和审批入口。</lang><lang lang="en">Use the coordinated verified archive and approval path.</lang>
    if: github.ref == 'refs/heads/main' && (inputs.operation == 'candidate-audit' || inputs.operation == 'candidate-publish')
    uses: mandolin/HIA-Documentation/.github/workflows/publish-npm-candidate.yml@c705ea20f180065a0bc255e9ed512e7ada13e908
    with:
      release_revision: c705ea20f180065a0bc255e9ed512e7ada13e908
      mode: ${{ inputs.operation == 'candidate-audit' && 'audit' || 'publish' }}
      package_name: ${{ inputs.package_name }}
      confirmation: ${{ inputs.confirm_publish }}
    secrets:
      bootstrap_token: ${{ secrets.HIA_NPM_BOOTSTRAP_TOKEN }}
